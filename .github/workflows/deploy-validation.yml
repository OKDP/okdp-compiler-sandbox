# End-to-end install validation of the deployments repository (gitops/), with both
# GitOps engines, as the README installs it:
#
#   1. kind cluster argocd: the platform's dependencies installed with helm
#      (scripts/bootstrap.sh: cert-manager, the tools, ingress-nginx, the DNS,
#      CloudNativePG, External Secrets and the secret store, Keycloak, RustFS,
#      Forgejo and its CI runner), this commit, compiled, and the service
#      catalogs pushed to Forgejo in the repositories of the topology
#      (scripts/configure.sh --push), Argo CD, gitops/argocd/, wait for every
#      Application (scripts/e2e-kind.sh up argocd);
#   2. kind cluster fluxcd: the same with Flux and gitops/flux/sync.yaml;
#   3. scripts/compare-engines.sh: the live objects of every compiled release
#      must be identical under both engines (the dependencies, installed by helm
#      the same way on both, are not compared).
#
# The platform's projects only (E2E_SKIP_PROJECTS=demo): two clusters with the demo
# project do not fit a hosted runner (about 32 GB each). This workflow validates the
# deployment layer, not the packages, which their catalogs test. The topology is io
# (okdp/okdp-platform, okdp/okdp-projects and the output okdp/okdp-output), or the
# one chosen when run by hand (split); the CI of the output repository, on its
# schedule, must compile a plain commit of the sources, and the output's main refuse
# the admin's push. The service catalogs of gitops/catalogs.yaml are fetched
# next to this repository at the commit they pin (its full history: Forgejo refuses
# a shallow push); nothing OKDP comes from a registry but the control plane images and
# the chart okdp-objects. The control plane server is built from
# okdp-control-plane-server (with okdp-gitops, whose compile checks what it writes),
# okdp-gitops from its repository; e2e-kind.sh pushes both, and the chart built from
# okdp-objects-chart, to the sandbox's registry (README step 2) and names them by digest.

name: Deploy validation (sandbox e2e, Argo CD and Flux)

on:
  pull_request:
    paths:
      - "gitops/**"
      - "scripts/**"
      - ".github/workflows/deploy-validation.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      topology:
        description: Repositories of the deployment (scripts/configure.sh --topology)
        type: choice
        options: [io, split]
        default: io

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  E2E_DIR: ${{ github.workspace }}/.e2e
  E2E_TOPOLOGY: ${{ inputs.topology || 'io' }}
  E2E_SKIP_PROJECTS: demo
  E2E_TIMEOUT: "2400"
  ARGOCD_VERSION: v3.4.2
  # sha256 of manifests/install.yaml of argoproj/argo-cd at ${ARGOCD_VERSION},
  # which scripts/e2e-kind.sh applies only if it matches (as its default). Update
  # both together.
  ARGOCD_INSTALL_SHA256: 69114b8c9eb48a1d08598e6f654a0869b10ae902456ea4b70796cb563760f5ec
  # The Flux CLI's version (the action below installs it); scripts/e2e-kind.sh
  # installs its embedded manifests, refusing another FLUX_VERSION.
  FLUX_VERSION: v2.9.5
  HELM_VERSION: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
  KIND_VERSION: v0.33.0
  # sha256 of kind-linux-amd64 ${KIND_VERSION}, from the release's
  # kind-linux-amd64.sha256sum. Update both together.
  KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
  # The commits the sandbox is tested with, fetched by SHA (a branch moves under
  # the test); okdp-compiler and cel2yaml are the releases their go.mod require.
  # TODO(okdp-gitops): releases, once the feat/claim-provisioner branches land.
  # Bump the two together.
  OKDP_CONTROL_PLANE_SERVER_REF: c8847a4239cad57eec61881ab01668ed1bb68774
  OKDP_GITOPS_REF: 852cd797174cd8572b7f644bf238c8c660abab1f
  # The chart of the instances' objects, pushed to the sandbox's registry (e2e-kind.sh).
  OKDP_OBJECTS_CHART_REF: c57cc57ef8d13ff7812c991e85ef31d710da6dfd
  E2E_SERVER_IMAGE: okdp-control-plane-server:e2e
  E2E_GITOPS_IMAGE: okdp-gitops:e2e

jobs:
  deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free up disk space 📦
        uses: okdp/gh-workflows/.github/actions/free-disk-space@1d759512906df1e647fbb632c44dd0d846bacbf4 # v1.1.3

      - name: Set up helm 🛠️
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up the Flux CLI 🛠️
        uses: fluxcd/flux2/action@3fa784edd773d56630bb9f62645e08f70c2cff0a # v2.10.0
        with:
          version: ${{ env.FLUX_VERSION }}

      - name: Set up kind 🛠️
        run: |
          set -euo pipefail
          curl -sSfLo "${RUNNER_TEMP}/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  ${RUNNER_TEMP}/kind" | sha256sum -c -
          sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind
          kind version; helm version; flux version --client

      - name: Clone okdp-control-plane-server, okdp-gitops, okdp-objects-chart and the service catalogs 📥
        run: |
          set -euo pipefail
          fetch() { # <repository> <commit>: ../<repository> at that commit
            git init -q "../$1"
            git -C "../$1" remote add origin "https://github.com/OKDP/$1.git"
            git -C "../$1" fetch -q --depth 1 origin "$2"
            git -C "../$1" checkout -q FETCH_HEAD
          }
          fetch okdp-control-plane-server "${OKDP_CONTROL_PLANE_SERVER_REF}"
          fetch okdp-gitops "${OKDP_GITOPS_REF}"
          fetch okdp-objects-chart "${OKDP_OBJECTS_CHART_REF}"
          # The catalogs, at the commit gitops/catalogs.yaml pins, not shallow:
          # e2e-kind.sh pushes them to the cluster's Forgejo (yq is preinstalled).
          yq -r '.repositories[] | [.name, .ref] | @tsv' gitops/catalogs.yaml \
            | while IFS=$'\t' read -r name ref; do
                git init -q "../${name}"
                git -C "../${name}" remote add origin "https://github.com/OKDP/${name}.git"
                git -C "../${name}" fetch -q origin "${ref}"
                git -C "../${name}" checkout -q FETCH_HEAD
              done

      - name: Set up Go 🛠️
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ../okdp-gitops/go.mod
          cache: false

      - name: Build okdp-gitops, its image (the CI runner's) and the control plane server image 🛠️
        run: |
          set -euo pipefail
          (cd ../okdp-gitops && go build -o "${RUNNER_TEMP}/bin/okdp-gitops" ./cmd/okdp-gitops)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          # The server's Dockerfile copies okdp-gitops from a build context.
          docker build -t "${E2E_GITOPS_IMAGE}" ../okdp-gitops
          docker build -t "${E2E_SERVER_IMAGE}" \
            --build-context okdp-gitops=../okdp-gitops ../okdp-control-plane-server

      - name: Deploy with Argo CD 🚀
        run: scripts/e2e-kind.sh up argocd

      - name: Deploy with Flux 🚀
        run: scripts/e2e-kind.sh up flux

      - name: Compare the two engines ✅
        env:
          # Expected differences, reported but not counted:
          # the control plane server follows the engine: gitops.engine
          # (GITOPS_ENGINE, the config checksum) and its engine RBAC.
          COMPARE_EXPECTED: >-
            okdp-system/configmap/okdp-system-okdp-control-plane-server
            okdp-system/deployment.apps/okdp-system-okdp-control-plane-server
            okdp-system/clusterrole.rbac.authorization.k8s.io/okdp-system-okdp-control-plane-server
        run: |
          # The releases deployed: projects/<p>/instances/<i> is <p>/<p>-<i>, the
          # projects of E2E_SKIP_PROJECTS left out.
          releases=()
          for f in gitops/projects/*/instances/*/instance.yaml; do
            i="${f%/instance.yaml}"; i="${i##*/}"; p="${f#gitops/projects/}"; p="${p%%/*}"
            [[ " ${E2E_SKIP_PROJECTS} " == *" $p "* ]] || releases+=("$p/$p-$i")
          done
          scripts/compare-engines.sh "$E2E_DIR/argocd.kubeconfig" "$E2E_DIR/flux.kubeconfig" "${releases[@]}"

      - name: Diagnostics 🔎
        if: failure()
        run: |
          for engine in argocd flux; do
            kc="$E2E_DIR/$engine.kubeconfig"
            [[ -f "$kc" ]] || continue
            echo "======== $engine"
            kubectl --kubeconfig "$kc" get pods -A || true
            kubectl --kubeconfig "$kc" get applications.argoproj.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get helmreleases.helm.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get kustomizations.kustomize.toolkit.fluxcd.io -A 2>/dev/null || true
            kubectl --kubeconfig "$kc" get events -A --sort-by=.lastTimestamp | tail -n 100 || true
          done
