# Checks the deployments repository layout (gitops/): the sandbox's own files (its
# topology, entry points, the CI's workflow), the layout compiles (okdp-gitops
# compile, the only source of the tree's rules: every instance compiled with its
# package of the service catalogs, its values checked against the upstream charts)
# into the output tree scripts/configure.sh --push would push (never committed
# here), the optional projects too, kustomize builds, helm template of every
# compiled instance; in the committed topology (io), then in split (a copy configured
# for it). The bootstrap (the platform's prerequisites) is sandbox-charts'
# bootstrap/, checked there.
#
# okdp-gitops is built from its repository, with okdp-compiler next to it (its go.mod
# replaces it). The service catalogs of gitops/catalogs.yaml
# (platform-charts, sandbox-charts, community-charts) are fetched next to this
# repository at the commit the catalog pins, where scripts/check.sh reads them. The
# compile pulls the upstream charts of the compiled umbrellas into its chart cache
# (okdp-gitops compile --charts, scripts/check.sh --charts), helm the charts it
# renders (helm dependency build): nothing OKDP is pulled from a registry.

name: GitOps layout check

on:
  pull_request:
    paths:
      - "gitops/**"
      - "scripts/**"
      - ".github/workflows/gitops-check.yml"
  push:
    branches: [main]
    paths:
      - "gitops/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  HELM_VERSION: v3.21.4   # same Helm 3 as OKDP/gh-workflows okdp-chart-ci.yml
  KUSTOMIZE_VERSION: v5.8.1
  # sha256 of kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz, from the
  # release's checksums.txt. Update both together.
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  # The commits the layout is checked with, fetched by SHA (a branch moves under
  # the check), the same as deploy-validation.yml's. TODO(okdp-compiler):
  # releases, once the feat/claim-provisioner branches land.
  OKDP_GITOPS_REF: b2bb34dfd3b68405ffa971f48b3263828c2bdfa8
  OKDP_COMPILER_REF: 94e7e2d6712854a09b95aec1caac22a4068714a3

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo ⚡️
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Clone okdp-gitops, okdp-compiler and the service catalogs 📥
        run: |
          set -euo pipefail
          fetch() { # <repository> <commit>: ../<repository> at that commit
            git init -q "../$1"
            git -C "../$1" remote add origin "https://github.com/OKDP/$1.git"
            git -C "../$1" fetch -q --depth 1 origin "$2"
            git -C "../$1" checkout -q FETCH_HEAD
          }
          fetch okdp-gitops "${OKDP_GITOPS_REF}"
          fetch okdp-compiler "${OKDP_COMPILER_REF}"
          # The catalogs, at the commit gitops/catalogs.yaml pins (yq is
          # preinstalled; scripts/check.sh warns of a branch, fetched all the same).
          yq -r '.repositories[] | [.name, .ref] | @tsv' gitops/catalogs.yaml \
            | while IFS=$'\t' read -r name ref; do fetch "${name}" "${ref}"; done

      - name: Set up Go 🛠️
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: ../okdp-gitops/go.mod
          cache: false

      - name: Build okdp-gitops 🛠️
        run: |
          set -euo pipefail
          (cd ../okdp-gitops && go build -o "${RUNNER_TEMP}/bin/okdp-gitops" ./cmd/okdp-gitops)
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Set up helm 🛠️
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kustomize 🛠️
        run: |
          set -euo pipefail
          tgz="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -sSfLo "${RUNNER_TEMP}/${tgz}" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/${tgz}"
          echo "${KUSTOMIZE_SHA256}  ${RUNNER_TEMP}/${tgz}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${tgz}" -C "${RUNNER_TEMP}" kustomize
          sudo install -m 0755 "${RUNNER_TEMP}/kustomize" /usr/local/bin/kustomize
          kustomize version; helm version

      - name: Check the layout ✅
        # yq v4 is preinstalled on ubuntu-latest. The compile fills the chart cache.
        run: scripts/check.sh --charts "${RUNNER_TEMP}/charts" --helm

      - name: Check the layout in the split topology ✅
        # A copy of the layout, configured for split (the committed one is io): the
        # same tree, its repositories one per project.
        run: |
          set -euo pipefail
          cp -R gitops "${RUNNER_TEMP}/split"
          scripts/configure.sh --root "${RUNNER_TEMP}/split" --topology split </dev/null
          scripts/check.sh --root "${RUNNER_TEMP}/split" --charts "${RUNNER_TEMP}/charts"
