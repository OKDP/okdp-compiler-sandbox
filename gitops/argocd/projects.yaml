# The projects' manifests: one Application okdp.project.<p> per compiled project,
# compiled/projects/<p>/ (the compile writes it for every project with an
# instance), which applies compiled/projects/<p>/project/, what okdp-compiler's
# Argo CD target writes for the project, as plain files (no Helm, no Kustomize):
#   namespace.yaml     Namespace <p>, its Pod Security labels ("privileged" for the
#                      platform's own projects, global.okdp.policy.privileged of
#                      platform.yaml; "baseline" enforced for the others), kept when
#                      the project is removed (Delete=false);
#   secret-store.yaml  the ServiceAccount okdp-secrets and the SecretStore
#                      okdp-secrets of <p>, through which it reaches the platform's
#                      secret store (global.okdp.secrets);
#   access.yaml        the RoleBindings okdp-access-<role> of <p>, its people's
#                      groups (project.yaml access, by default okdp-project-<p>
#                      editor) bound to the ClusterRoles view, edit and admin;
#   control-plane.yaml the Role and RoleBinding okdp-control-plane of <p>, what the
#                      control plane's ServiceAccount does there
#                      (global.okdp.controlPlane of platform.yaml), when it is set;
#   network-policy.yaml the NetworkPolicy okdp-project of <p>, its pods' ingress
#                      from <p>, the platform's ingress namespaces and its claimers'
#                      namespaces only (global.okdp.network of platform.yaml), for a
#                      project that is not the platform's, when it is set;
#   appproject.yaml    AppProject project-<p> in argocd, which the Applications of
#                      its instances name: sources the output repository; destined
#                      to namespace <p> only, no cluster-scoped kind, for a project
#                      that is not the platform's; every namespace and kind for one
#                      of the platform's own; its roles viewer, editor and admin,
#                      the groups of project.yaml access.
# The same directory holds the files of the Flux target (kustomization.yaml,
# service-account.yaml, the identity of helm-controller in okdp-releases), which
# Argo CD does not apply: only the six files above are included. The
# Applications are of the entry point's AppProject okdp, which may write the
# Namespaces, the AppProjects, the Roles and the RoleBindings (project.yaml); Argo
# CD's application controller, whose identity applies them, holds every
# permission, those of view, edit, admin and of the control plane's Role among them
# (a RoleBinding grants no more than its applier holds). The instances'
# Applications wait, retried, for their AppProject and their namespace. Argo CD reads the output
# repository only. <p> is the directory name, never a value read from a file of
# the project.
# The ApplicationSet and its Applications are named with a dot, which no release,
# <project>-<instance> (a DNS label), can take: an Application okdp-project-<p> would
# be the release of the instance project-<p> of a project okdp, which would replace
# it (instances.yaml).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: okdp.projects
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-output.git
        revision: main
        directories:
          - path: compiled/projects/*
  template:
    metadata:
      name: 'okdp.project.{{ .path.basename }}'
      # Not okdp.io/project: the console lists the services of a project by that label.
      labels:
        okdp.io/appproject: 'project-{{ .path.basename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: okdp
      source:
        repoURL: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-output.git
        targetRevision: main
        path: 'compiled/projects/{{ .path.basename }}/project'
        # A plain directory, explicitly: Argo CD would read it as a Kustomize
        # application (the Flux target's kustomization.yaml).
        directory:
          include: '{namespace.yaml,secret-store.yaml,access.yaml,control-plane.yaml,network-policy.yaml,appproject.yaml}'
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Server-side, as the instances' Applications: an existing namespace
          # (kube-system, default) gets its labels, its other fields left alone.
          - ServerSideApply=true
        retry:
          # Unlimited, as the instances' Applications (instances.yaml).
          limit: -1
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
