# The registry of the okdp-objects chart, a dependency of every compiled umbrella
# (global.okdp.charts.objects of platform.yaml): the sandbox's registry, plain HTTP
# (README, step 2, until okdp-objects is published). Same address as the
# HelmRepository of gitops/flux/sync.yaml. No credential: the registry is anonymous.
# Argo CD v3.4.2 (Helm 3.19) needs no entry to reach it: helm dependency build falls
# back to plain HTTP by itself (Helm 3's OCI client). This Secret is what Argo CD 3.5
# (Helm 4, which has no fallback) requires, passing --plain-http to the dependency
# build.
apiVersion: v1
kind: Secret
metadata:
  name: okdp-objects-registry
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: okdp-objects
  url: okdp-registry:5000/okdp/charts
  enableOCI: "true"
  insecureOCIForceHttp: "true"
