# Argo CD entry point. Bootstrap once, from the okdp-sandbox checkout, after Argo CD
# itself (a dependency of the platform, README step 5a), with:
#   kubectl apply -n argocd -f gitops/argocd/
# then Application "okdp" (root.yaml) manages this directory from Git: instances.yaml
# and projects.yaml. Every file reads the output repository only, okdp-output, a
# repository of its own in every topology, which the CI alone writes; compiled/ and
# argocd/ at its root. scripts/configure.sh --push puts this directory
# there with the compiled tree (okdp-gitops writes the Applications of the instances
# because root.yaml is there, from its source); scripts/configure.sh --topology
# rewrites the URLs.
# The AppProject of the platform's objects: root.yaml (this directory: the
# Application okdp, the ApplicationSets okdp.instances and okdp.projects, the
# AppProjects okdp and okdp.instances) and the Applications of the projects'
# manifests (projects.yaml), which write the Namespaces, the AppProjects project-<p>
# in argocd and the SecretStores of the namespaces: every namespace and every
# cluster-scoped kind, as the platform's administrators, who alone change this
# directory; the output repository its only source. The parents of the projects'
# instances are not of this project: their own, okdp.instances (instances.yaml), writes
# Applications only. The instances of each project use the AppProject project-<p>
# the compiler writes for it, confined to namespace <p> unless the project is one of
# the platform's own (global.okdp.policy.privileged).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: okdp
  namespace: argocd
spec:
  description: The Argo CD entry point of OKDP, the platform's objects.
  sourceRepos:
    - http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-output.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
