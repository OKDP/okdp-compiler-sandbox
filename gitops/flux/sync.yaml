# Flux entry point, applied once, from the okdp-sandbox checkout, after Flux itself (a
# dependency of the platform, README step 5b):
#   kubectl apply -f gitops/flux/sync.yaml
# GitRepository okdp-gitops is the output repository, the only one Flux reads,
# authenticated with the Secret okdp-gitops-reader (secretRef), created by
# scripts/configure.sh --push (forgejo_engine_secrets): a read token of the Forgejo
# user okdp-reader, who reads the output repository only;
# okdp-output, a repository of its own in every topology, which the CI alone writes;
# compiled/ at its root. scripts/configure.sh --topology rewrites its URL.
# The Kustomization okdp syncs the whole compiled tree: compiled/projects/
# kustomization.yaml, which okdp-compiler's Flux target writes, lists the projects;
# each project's, its instances and its manifests (project/); each instance's, its
# HelmRelease and values ConfigMap in okdp-releases. The project's manifests: its
# Namespace with its Pod Security labels, the ServiceAccount and SecretStore of the
# platform's secret store in it, and, for a project that is not one of the
# platform's own (global.okdp.policy.privileged of platform.yaml), its
# NetworkPolicy okdp-project (global.okdp.network) and the ServiceAccount
# project-<p> in okdp-releases, bound to every verb of namespace <p> only, as
# which helm-controller installs its releases (serviceAccountName); the
# platform's own projects' releases are helm-controller's. kustomize-controller
# applies the Namespaces and the RBAC first. Not generated, not in the output
# repository. Names no release, <project>-<instance>, can take in these namespaces:
# the Kustomization okdp, without a dash; the GitRepository okdp-gitops, the source
# okdp-compiler's HelmReleases name (flux-system/okdp-gitops), in flux-system, where
# no project's object can be (the compile refuses a project of the engines'
# namespaces) and no compiled object is (the HelmReleases are in okdp-releases).
apiVersion: v1
kind: Namespace
metadata:
  name: okdp-releases
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: okdp-gitops
  namespace: flux-system
spec:
  interval: 1m
  url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-output.git
  ref:
    branch: main
  secretRef:
    name: okdp-gitops-reader
---
# No wait: one broken instance must not block the others; a HelmRelease waits for the
# releases it depends on (dependsOn), and retries until the CRDs of an operator exist.
# Applied as kustomize-controller's own ServiceAccount, whose cluster-admin binding the
# Flux install gives: kustomize-controller runs with
# --default-service-account=okdp-none (README, step 5b), which a Kustomization
# without serviceAccountName would impersonate, with no permission; this one writes
# the Namespaces, the RBAC of the projects (the ServiceAccounts project-<p> and their
# bindings, the RoleBindings of project/access.yaml to view, edit and admin, the
# control plane's Role: a RoleBinding grants no more than its applier holds) and the
# HelmReleases.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: okdp
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: okdp-gitops
  path: ./compiled/projects
  serviceAccountName: kustomize-controller
  prune: true
  # A project's namespace is kept when the project is removed (its volumes with it,
  # until an administrator deletes it), as Argo CD's Delete=false: never pruned.
  patches:
    - target:
        kind: Namespace
      patch: |
        apiVersion: v1
        kind: Namespace
        metadata:
          name: not-used
          annotations:
            kustomize.toolkit.fluxcd.io/prune: disabled
