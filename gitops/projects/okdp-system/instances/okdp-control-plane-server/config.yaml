# okdp-system/okdp-control-plane-server: the OKDP package okdp-control-plane-server
# (platform-charts catalog). The console's API: it commits to the repositories of
# the sources served by Forgejo (a dependency of the platform, sandbox-charts'
# bootstrap/forgejo), never to the output, which the CI of the output repository
# compiles, and reads the cluster. The topology names every repository: there is no
# single deployments repository (gitops.repoURL is gone).
gitops:
  # Written by scripts/configure.sh --topology io|split: the repositories of the
  # platform, of the projects and of the compiled tree (GITOPS_CONFIG).
  topology:
    platform:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-platform.git
      branch: main
      path: ""
    projects:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-projects.git
      branch: main
      path: projects/{project}
    output:
      url: http://forgejo-http.forgejo.svc.cluster.local:3000/okdp/okdp-output.git
      branch: main
      path: ""
  # argocd or flux: set it to the engine that deploys the output repository.
  engine: argocd
  # The Forgejo user okdp-console, not an admin, which writes to the repositories of
  # the sources only and reads the output and the catalogs (the output is the CI's,
  # okdp-ci's alone): scripts/configure.sh --push creates it and writes this Secret in
  # the server's namespace, never in Git: username okdp-console, password an access
  # token of it (write:repository), no password of the account.
  credentialsSecret: okdp-console-git
  # The upstream charts of the instances, pulled for the checks of each compile.
  chartCacheDir: /var/cache/okdp/charts
  # The hosts the server sends a credential to over http://, in clear
  # (GITOPS_INSECURE_HTTP_HOSTS; every other http:// URL is refused one): the
  # in-cluster Forgejo of the topology and of the catalogs, its exact host, never a
  # glob such as *.svc.cluster.local, which would trust every Service of the
  # cluster (check.sh refuses one); as the CI's (CI_INSECURE_HTTP_HOSTS,
  # scripts/lib/topology.sh). Without it the console reaches no repository.
  insecureHTTPHosts:
    - forgejo-http.forgejo.svc.cluster.local
# The CA bundle every TLS client of the server trusts beside the system's (the
# OIDC issuer, Keycloak, Trino, the SQL editor and the connection tests, Git),
# mounted at /etc/okdp/ca (OKDP_CA_FILE): the platform's (platform.yaml
# global.okdp.tls.caBundleSecret, key ca.crt), which trust-manager writes in every
# namespace, the sandbox CA's certificates of default-issuer. The callers' groups
# are the tokens' claim groups, the server's default (oidc.groupsClaim), as the
# realm okdp's mapper writes them.
tls:
  caBundleSecret: certs-bundle
# User and group management through the Keycloak Admin API (URL and realm from the
# platform OIDC issuer), as the realm's client okdp-control-plane, its credentials the
# Secret okdp-system/local-secrets-provider reads from the platform's secret store
# (okdp-system/keycloak/okdp-control-plane, written at the bootstrap, which only
# okdp-system reads). Keycloak's certificate is checked (no tlsInsecure), as the
# issuer's (platform.yaml global.okdp.oidc.insecureSkipVerify false), against the
# CA bundle above.
keycloak:
  credentialsSecret:
    name: okdp-control-plane-keycloak
# TODO(okdp-compiler): temporary registry, revert to quay.io/okdp once the OKDP images are published there.
# TODO(okdp-compiler): the image must be a server that compiles the instances it
# writes (okdp-control-plane-server, okdp-compiler branch): none is published yet;
# scripts/e2e-kind.sh builds one (E2E_SERVER_IMAGE).
imageRepository: repo.alliage.io:8082/okdp/images/okdp-control-plane-server
