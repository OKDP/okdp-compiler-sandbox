# The metastore database: db unset, a database of its own (the package's default),
# claimed of cnpg-system/cnpg-postgresql. The warehouse: the bucket of the project's S3
# connection platform-s3 (okdp, project.yaml), read with the connection's credentials,
# the platform's identity, which also reach bronze, where the external tables of okdp-examples live.
storage: platform-s3
