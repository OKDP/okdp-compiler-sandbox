# Secrets of the demo project (former project-demo/10-secrets.yaml), provisioned by
# the same local stand-in the platform uses; an external secret manager replaces it in
# real deployments. In this namespace only, where the services that read them run
# (no replication). The databases have no Secret here:
# their provider generates the credentials of each claim; nor the S3 store: the
# services read the platform's identity of the store from the platform's secret store,
# under this namespace's keys (demo/s3/platform, the connection platform-s3 of
# project.yaml). No credential is written here. The secrets of the Keycloak
# realm's clients are the realm's own: generated at the bootstrap (sandbox-charts'
# bootstrap/keycloak/client-secrets.sh), set on each client by the realm's import,
# written to the platform's secret store under demo/keycloak/<client>, the keys of
# this namespace, which no other namespace reads (sandbox-charts'
# bootstrap/openbao/init.sh, the consumers of bootstrap/openbao/clients.yaml: a client
# read here is listed there with demo) and read from there (remoteKey): Keycloak and
# these Secrets hold the same value. Only the client IDs are static (data).
secrets:
  # OAuth clients of the Keycloak realm (sandbox-charts'
  # bootstrap/keycloak/realm.yaml). The services' login clients
  # (creds-<release>-oauth2) are read with clientProvisioning: existing only: the
  # sandbox registers them by DCR (platform.yaml), each service's oidc-dcr Job writing
  # its client and the secret Keycloak gives it, which is what the services read. The
  # service accounts (svc-*, superset-trino) are read in both modes.
  - name: creds-demo-trino-oauth2
    remoteKey: demo/keycloak/trino
    properties: [client_secret]
    data: {client_id: trino}
  - name: creds-trino-oauth2-polaris
    remoteKey: demo/keycloak/svc-trino-polaris-writer
    properties: [client_secret]
    data: {client_id: svc-trino-polaris-writer}
  - name: creds-demo-superset-oauth2
    remoteKey: demo/keycloak/superset
    properties: [client_secret]
    data: {client_id: superset}
  - name: creds-demo-superset-oauth2-trino
    remoteKey: demo/keycloak/superset-trino
    properties: [client_secret]
    data: {client_id: superset-trino}
  # JupyterHub's login client, with the crypt key of the users' auth state: 32 random
  # bytes in hexadecimal, the SHA-256 of a generated value. JupyterHub's own key, which
  # the store does not hold, and an entry generates or reads, not both: the whole
  # Secret is generated, its client_secret too. It only matters with
  # clientProvisioning: existing, where it differs from the realm's client jupyterhub:
  # then write the generated client_secret into Secret keycloak/keycloak-client-secrets
  # (key jupyterhub) and run scripts/bootstrap.sh again, which imports it into the
  # realm and keeps it.
  - name: creds-demo-jupyterhub-oauth2
    generate:
      - {key: client_secret}
      - {key: JUPYTERHUB_CRYPT_KEY, transform: sha256}
    data: {client_id: jupyterhub}
  - name: creds-demo-spark-history-oauth2
    remoteKey: demo/keycloak/spark-history
    properties: [client_secret]
    data: {client_id: spark-history}
  - name: creds-demo-airflow-oauth2
    remoteKey: demo/keycloak/airflow
    properties: [client_secret]
    data: {client_id: airflow}
  - name: creds-demo-polaris-oauth2
    remoteKey: demo/keycloak/polaris
    properties: [client_secret]
    data: {client_id: polaris}
  # The initial access token of the services' oidc-dcr Jobs (clientProvisioning: dcr,
  # dcr.authMethod: initialAccessToken of platform.yaml): minted for this namespace
  # by the bootstrap (sandbox-charts' bootstrap/openbao/init.sh, DCR_NAMESPACES of
  # scripts/bootstrap.sh), written to demo/keycloak/dcr-token, read by the Jobs from
  # Secret okdp-dcr-token (key token).
  - name: okdp-dcr-token
    remoteKey: demo/keycloak/dcr-token
    properties: [token]
  # okdp-examples (optional, see gitops/optional/README.md).
  - name: creds-examples-oauth2-trino
    remoteKey: demo/keycloak/svc-trino-examples-writer
    properties: [client_secret]
    data: {client_id: svc-trino-examples-writer}
  - name: creds-polaris-oauth2-admin-okdp-sandbox
    remoteKey: demo/keycloak/svc-polaris-api-admin
    properties: [client_secret]
    data: {client_id: svc-polaris-api-admin}
